<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Black rounded square background -->
  <rect width="64" height="64" rx="16" ry="16" fill="#000000"/>

  <!-- Stylised "U" glyph — two vertical bars + rounded bottom arc -->
  <!-- Left bar -->
  <rect x="14" y="14" width="10" height="28" rx="5" ry="5" fill="#ffffff"/>
  <!-- Right bar -->
  <rect x="40" y="14" width="10" height="28" rx="5" ry="5" fill="#ffffff"/>
  <!-- Bottom arc connecting the two bars -->
  <path
    d="M14 37 Q14 52 32 52 Q50 52 50 37"
    fill="none"
    stroke="#ffffff"
    stroke-width="10"
    stroke-linecap="round"
  />

  <!-- Small emerald speed-dot accent -->
  <circle cx="49" cy="15" r="6" fill="#10b981"/>
</svg>